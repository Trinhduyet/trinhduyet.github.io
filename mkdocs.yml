site_name: AI-Enabled Software Architect Knowledge Roadmap
site_description: Lộ trình thực chiến từ C#/.NET Backend đến Distributed Systems, Microservices, AI Engineering, System Design và Software Architecture.
site_url: https://trinhduyet.github.io/
repo_url: https://github.com/Trinhduyet/trinhduyet.github.io
repo_name: Trinhduyet/trinhduyet.github.io
edit_uri: edit/main/docs/

strict: true

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    # Existing learning docs intentionally link to executable evidence in repo-level labs/.
    # MkDocs only resolves files under docs/, so keep these as informational during migration.
    not_found: info
    absolute_links: relative_to_docs
    unrecognized_links: info

watch:
  - README.md

theme:
  name: material
  language: vi
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Chuyển sang giao diện tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Chuyển sang giao diện sáng

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences

