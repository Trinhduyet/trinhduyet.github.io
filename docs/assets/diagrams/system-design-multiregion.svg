<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
<title id="title">Multi-region reliability design</title><desc id="desc">Global routing sends traffic to two regional stamps; data replication and disaster recovery targets are explicit rather than assumed.</desc>
<style>text{font-family:Inter,system-ui,sans-serif;fill:#2d3142}.tag{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#7a8399}.title{font-size:14px;font-weight:700}.sub{font-size:11px;fill:#4f5d75}.note{font-family:Georgia,serif;font-style:italic;font-size:14px;fill:#4f5d75}</style>
<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#4f5d75"/></marker><marker id="accent" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#eb6c36"/></marker></defs><rect width="1080" height="460" fill="#f5f5f5"/>
<text x="42" y="38" class="tag">RELIABILITY / DR</text><text x="42" y="64" class="title">Multi-region is justified by SLO, RTO/RPO, latency or residency — not by fashion.</text>
<rect x="446" y="92" width="188" height="72" rx="8" fill="#fff0e9" stroke="#eb6c36" stroke-width="1.5"/><text x="540" y="120" text-anchor="middle" class="title">Global Routing</text><text x="540" y="143" text-anchor="middle" class="sub">health · weights · failover</text>
<rect x="88" y="218" width="320" height="150" rx="10" fill="#fff" stroke="#2d3142"/><text x="112" y="246" class="tag">REGION A</text><rect x="120" y="266" width="110" height="64" rx="8" fill="#e8edf2" stroke="#7a8399"/><text x="175" y="292" text-anchor="middle" class="title">API</text><text x="175" y="313" text-anchor="middle" class="sub">multi-zone</text><rect x="262" y="266" width="110" height="64" rx="8" fill="#e9eaed" stroke="#4f5d75"/><text x="317" y="292" text-anchor="middle" class="title">Data A</text><text x="317" y="313" text-anchor="middle" class="sub">write owner?</text>
<rect x="672" y="218" width="320" height="150" rx="10" fill="#fff" stroke="#2d3142"/><text x="696" y="246" class="tag">REGION B</text><rect x="704" y="266" width="110" height="64" rx="8" fill="#e8edf2" stroke="#7a8399"/><text x="759" y="292" text-anchor="middle" class="title">API</text><text x="759" y="313" text-anchor="middle" class="sub">standby / active</text><rect x="846" y="266" width="110" height="64" rx="8" fill="#e9eaed" stroke="#4f5d75"/><text x="901" y="292" text-anchor="middle" class="title">Data B</text><text x="901" y="313" text-anchor="middle" class="sub">replica / owner</text>
<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arr)"><path d="M500 164V188H175V266"/><path d="M580 164V188H759V266"/></g>
<path d="M372 298H846" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#accent)"/><text x="609" y="286" text-anchor="middle" class="sub">replication semantics · RPO</text>
<text x="540" y="413" text-anchor="middle" class="note">Failover is not complete until the end-to-end user flow and data state meet recovery targets.</text>
</svg>