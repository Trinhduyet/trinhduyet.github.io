<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
<title id="title">Data scaling and consistency</title><desc id="desc">Source-of-truth primary database feeds read replicas and partitions while derived search and cache remain non-authoritative.</desc>
<style>text{font-family:Inter,system-ui,sans-serif;fill:#2d3142}.tag{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#7a8399}.title{font-size:14px;font-weight:700}.sub{font-size:11px;fill:#4f5d75}.note{font-family:Georgia,serif;font-style:italic;font-size:14px;fill:#4f5d75}</style>
<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#4f5d75"/></marker><marker id="accent" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#eb6c36"/></marker></defs><rect width="1040" height="430" fill="#f5f5f5"/>
<text x="42" y="38" class="tag">DATA SCALE</text><text x="42" y="64" class="title">Scale data without losing track of truth, routing and consistency.</text>
<rect x="52" y="132" width="140" height="78" rx="8" fill="#e8edf2" stroke="#7a8399"/><text x="122" y="162" text-anchor="middle" class="title">Application</text><text x="122" y="184" text-anchor="middle" class="sub">access patterns</text>
<rect x="280" y="132" width="160" height="78" rx="8" fill="#fff0e9" stroke="#eb6c36" stroke-width="1.5"/><text x="360" y="158" text-anchor="middle" class="title">Primary Store</text><text x="360" y="181" text-anchor="middle" class="sub">source of truth</text>
<rect x="526" y="82" width="148" height="70" rx="8" fill="#e9eaed" stroke="#4f5d75"/><text x="600" y="110" text-anchor="middle" class="title">Read Replica</text><text x="600" y="132" text-anchor="middle" class="sub">may lag</text>
<rect x="526" y="184" width="148" height="70" rx="8" fill="#e9eaed" stroke="#4f5d75"/><text x="600" y="212" text-anchor="middle" class="title">Derived Index</text><text x="600" y="234" text-anchor="middle" class="sub">search · read model</text>
<rect x="778" y="64" width="156" height="64" rx="8" fill="#fff" stroke="#2d3142"/><text x="856" y="91" text-anchor="middle" class="title">Shard A</text><text x="856" y="112" text-anchor="middle" class="sub">partition key slice</text>
<rect x="778" y="154" width="156" height="64" rx="8" fill="#fff" stroke="#2d3142"/><text x="856" y="181" text-anchor="middle" class="title">Shard B</text><text x="856" y="202" text-anchor="middle" class="sub">partition key slice</text>
<rect x="778" y="244" width="156" height="64" rx="8" fill="#fff" stroke="#2d3142"/><text x="856" y="271" text-anchor="middle" class="title">Shard C</text><text x="856" y="292" text-anchor="middle" class="sub">partition key slice</text>
<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arr)"><path d="M192 171H280"/><path d="M440 156H486V117H526"/><path d="M440 186H486V219H526"/><path d="M674 117H726V96H778"/><path d="M674 117H726V186H778"/><path d="M674 117H726V276H778"/></g>
