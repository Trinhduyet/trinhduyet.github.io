<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">Payment orchestration architecture</title>
<desc id="desc">Three coordinated flows: client payment acceptance through PSP, verified asynchronous provider callbacks and local durable accounting, then merchant notifications and reconciliation.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#273144}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px;fill:#53647a}.title{font-size:22px;font-weight:800}.lane{font-size:12px;font-weight:800;fill:#9a4b21;letter-spacing:1px}.node-title{font-size:15px;font-weight:750}.detail{font-size:12px;fill:#57677c}.note{font-size:12px;font-style:italic;fill:#63738b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55718f"/></marker></defs>
<rect width="1120" height="520" fill="#f6f8fb"/><text class="eyebrow" x="38" y="36">SYSTEM DESIGN · PAYMENTS</text><text class="title" x="38" y="66">Payment: separate provider outcome from local accounting</text>
<rect x="25" y="90" width="1070" height="122" rx="12" fill="#e9f2fd"/><rect x="25" y="228" width="1070" height="122" rx="12" fill="#fff0e4"/><rect x="25" y="366" width="1070" height="122" rx="12" fill="#e9f5f0"/>
<text class="lane" x="42" y="109">REQUEST · EXTERNAL OUTCOME MAY BE UNKNOWN</text><text class="lane" x="42" y="247">CONFIRMATION · VERIFY + DEDUP + ATOMIC POSTING</text><text class="lane" x="42" y="385">AFTER COMMIT · ASYNC DELIVERY + RECONCILIATION</text>
<g fill="#fff" stroke="#7994b1" stroke-width="1.3"><rect x="45" y="128" width="192" height="66" rx="9"/><rect x="309" y="128" width="210" height="66" rx="9"/><rect x="591" y="128" width="212" height="66" rx="9"/><rect x="875" y="128" width="197" height="66" rx="9"/><rect x="45" y="266" width="192" height="66" rx="9"/><rect x="309" y="266" width="210" height="66" rx="9"/><rect x="591" y="266" width="212" height="66" rx="9"/><rect x="875" y="266" width="197" height="66" rx="9"/><rect x="45" y="404" width="192" height="66" rx="9"/><rect x="309" y="404" width="210" height="66" rx="9"/><rect x="591" y="404" width="212" height="66" rx="9"/><rect x="875" y="404" width="197" height="66" rx="9"/></g>
<g text-anchor="middle"><text class="node-title" x="141" y="153">Buyer / POS</text><text class="detail" x="141" y="175">Hosted card token</text><text class="node-title" x="414" y="153">Gateway + Auth</text><text class="detail" x="414" y="175">Merchant scope</text><text class="node-title" x="697" y="153">Payment Service</text><text class="detail" x="697" y="175">Intent · idempotency</text><text class="node-title" x="973" y="153">PSP / Bank</text><text class="detail" x="973" y="175">Authorize · capture</text><text class="node-title" x="141" y="291">PSP Webhook</text><text class="detail" x="141" y="313">May retry / reorder</text><text class="node-title" x="414" y="291">Signature + Inbox</text><text class="detail" x="414" y="313">Verify · dedup</text><text class="node-title" x="697" y="291">Payments + Ledger</text><text class="detail" x="697" y="313">State · journal · outbox</text><text class="node-title" x="973" y="291">Outbox Relay</text><text class="detail" x="973" y="313">CDC or polling</text><text class="node-title" x="141" y="429">Reconciler</text><text class="detail" x="141" y="451">Resolve UNKNOWN</text><text class="node-title" x="414" y="429">Provider Evidence</text><text class="detail" x="414" y="451">Status / settlement</text><text class="node-title" x="697" y="429">Event Broker</text><text class="detail" x="697" y="451">Delivery + replay</text><text class="node-title" x="973" y="429">Merchant Webhook</text><text class="detail" x="973" y="451">Signed / retried</text></g>
<g fill="none" stroke="#55718f" stroke-width="2" marker-end="url(#arrow)"><path d="M237 161H303"/><path d="M519 161H585"/><path d="M803 161H869"/><path d="M237 299H303"/><path d="M519 299H585"/><path d="M803 299H869"/><path d="M237 437H303"/><path d="M519 437H585"/><path d="M803 437H869"/></g>
<text class="note" x="38" y="507">An HTTP timeout is not a failed payment. Reconcile outcomes; never post the same logical ledger entry twice.</text>
</svg>
