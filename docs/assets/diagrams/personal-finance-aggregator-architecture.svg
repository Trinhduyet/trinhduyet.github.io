<g text-anchor="middle"><text class="node-title" x="141" y="153">Mobile / Web</text><text class="detail" x="141" y="175">Connections · budgets</text><text class="node-title" x="414" y="153">API + Consent</text><text class="detail" x="414" y="175">Auth · revoke</text><text class="node-title" x="697" y="153">Finance Query</text><text class="detail" x="697" y="175">Cache · stale label</text><text class="node-title" x="973" y="153">Canonical DB</text><text class="detail" x="973" y="175">Transactions · cursor</text><text class="node-title" x="141" y="291">Webhooks + Timer</text><text class="detail" x="141" y="313">Coalesce jobs</text><text class="node-title" x="414" y="291">Durable Sync Queue</text><text class="detail" x="414" y="313">Priority · retries</text><text class="node-title" x="697" y="291">Sync + Rate Limit</text><text class="detail" x="697" y="313">Redis quota lease</text><text class="node-title" x="973" y="291">Bank APIs</text><text class="detail" x="973" y="313">Delta · 429 · consent</text><text class="node-title" x="141" y="429">Transaction Outbox</text><text class="detail" x="141" y="451">Normalized changes</text><text class="node-title" x="414" y="429">CDC / Kafka</text><text class="detail" x="414" y="451">At-least-once</text><text class="node-title" x="697" y="429">Budget Workers</text><text class="detail" x="697" y="451">Recompute · dedup</text><text class="node-title" x="973" y="429">Push / Email</text><text class="detail" x="973" y="451">Outbox · preferences</text></g>
