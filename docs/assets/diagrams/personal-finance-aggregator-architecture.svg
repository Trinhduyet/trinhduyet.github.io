<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">Personal finance aggregator architecture</title>
<desc id="desc">Three lanes show API and consent, provider synchronization with a durable queue and distributed quota, and normalized data change events driving budget notifications.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#273144}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px;fill:#53647a}.title{font-size:22px;font-weight:800}.lane{font-size:12px;font-weight:800;fill:#9a4b21;letter-spacing:1px}.node-title{font-size:15px;font-weight:750}.detail{font-size:12px;fill:#57677c}.note{font-size:12px;font-style:italic;fill:#63738b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55718f"/></marker></defs>
<rect width="1120" height="520" fill="#f6f8fb"/><text class="eyebrow" x="38" y="36">SYSTEM DESIGN · FINANCIAL AGGREGATION</text><text class="title" x="38" y="66">Personal Finance: quota-aware ingestion and budget alerts</text>
<rect x="25" y="90" width="1070" height="122" rx="12" fill="#e9f2fd"/><rect x="25" y="228" width="1070" height="122" rx="12" fill="#fff0e4"/><rect x="25" y="366" width="1070" height="122" rx="12" fill="#e9f5f0"/>
<text class="lane" x="42" y="109">READ · EXPLICIT DATA FRESHNESS</text><text class="lane" x="42" y="247">BANK INTEGRATION · WEBHOOK-FIRST / POLLING FALLBACK</text><text class="lane" x="42" y="385">LOCAL EVENTS · CORRECT BUDGET EVALUATION</text>
