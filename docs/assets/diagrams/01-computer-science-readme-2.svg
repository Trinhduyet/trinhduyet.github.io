<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Module 01 dependency map</title>
  <desc id="desc">Dependency map từ prerequisite C# qua complexity, data structures, scheduling, memory và các module production tiếp theo.</desc>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#2d3142}
    .title{font-size:19px;font-weight:700}
    .sub{font-size:14px;fill:#4f5d75}
    .box{fill:#fff;stroke:#2d3142;stroke-width:1.4}
    .soft{fill:#e8edf2;stroke:#7a8399;stroke-width:1.4}
    .accent{fill:#fff0e9;stroke:#eb6c36;stroke-width:1.6}
    .edge{fill:none;stroke:#64748b;stroke-width:1.5}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="760" fill="#f8fafc"/>

  <rect class="box" x="320" y="35" width="260" height="90" rx="14"/>
  <text class="title" x="450" y="73" text-anchor="middle">Prerequisite</text>
  <text class="sub" x="450" y="100" text-anchor="middle">C# syntax cơ bản</text>

  <path class="edge" d="M450 125 V165 H230 V195" marker-end="url(#arrow)"/>
  <path class="edge" d="M450 125 V165 H670 V195" marker-end="url(#arrow)"/>

  <rect class="box" x="110" y="195" width="240" height="100" rx="14"/>
  <text class="title" x="230" y="235" text-anchor="middle">
    <tspan x="230" dy="0">1. Complexity</tspan>
    <tspan x="230" dy="25">+ workload</tspan>
  </text>

  <rect class="box" x="550" y="195" width="240" height="100" rx="14"/>
  <text class="title" x="670" y="235" text-anchor="middle">
    <tspan x="670" dy="0">3. Scheduling</tspan>
    <tspan x="670" dy="25">+ concurrency</tspan>
  </text>

  <path class="edge" d="M230 295 V335 H175 V365" marker-end="url(#arrow)"/>
  <path class="edge" d="M670 295 V335 H450 V365" marker-end="url(#arrow)"/>
  <path class="edge" d="M670 295 V335 H725 V365" marker-end="url(#arrow)"/>

  <rect class="box" x="55" y="365" width="240" height="95" rx="14"/>
  <text class="title" x="175" y="420" text-anchor="middle">2. Data structures</text>

  <rect class="box" x="330" y="365" width="240" height="95" rx="14"/>
  <text class="title" x="450" y="420" text-anchor="middle">4. Memory + cache</text>

  <rect class="accent" x="605" y="365" width="240" height="95" rx="14"/>
  <text class="title" x="725" y="405" text-anchor="middle">WorkloadLab</text>
  <text class="sub" x="725" y="435" text-anchor="middle">lookup · race · locality</text>

  <path class="edge" d="M175 460 V505 H330 V535" marker-end="url(#arrow)"/>
  <path class="edge" d="M450 460 V505 H570 V535" marker-end="url(#arrow)"/>
  <path class="edge" d="M725 460 V505 H570"/>

  <rect class="soft" x="210" y="535" width="240" height="95" rx="14"/>
  <text class="title" x="330" y="575" text-anchor="middle">Module 02</text>
  <text class="sub" x="330" y="605" text-anchor="middle">Linux resource diagnosis</text>

  <rect class="box" x="490" y="535" width="240" height="95" rx="14"/>
  <text class="title" x="610" y="575" text-anchor="middle">Module 03</text>
  <text class="sub" x="610" y="605" text-anchor="middle">.NET runtime deep dive</text>

  <path class="edge" d="M330 630 V670 H450 V695" marker-end="url(#arrow)"/>
  <path class="edge" d="M610 630 V670 H450"/>

  <rect class="box" x="320" y="695" width="260" height="55" rx="14"/>
  <text class="title" x="450" y="730" text-anchor="middle">Module 10 · Performance</text>
</svg>
