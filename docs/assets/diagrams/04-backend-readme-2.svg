<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1050 760" role="img" aria-labelledby="title desc">
  <title id="title">Module 04 dependency map</title>
  <desc id="desc">Backend request lifecycle dependency map từ .NET runtime và networking tới endpoint, security, capacity, integration, SQL, API design và project.</desc>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#2d3142}
    .title{font-size:18px;font-weight:700}
    .sub{font-size:13px;fill:#4f5d75}
    .box{fill:#fff;stroke:#2d3142;stroke-width:1.4}
    .soft{fill:#e8edf2;stroke:#7a8399;stroke-width:1.4}
    .accent{fill:#fff0e9;stroke:#eb6c36;stroke-width:1.6}
    .edge{fill:none;stroke:#64748b;stroke-width:1.5}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1050" height="760" fill="#f8fafc"/>

  <rect class="box" x="210" y="35" width="270" height="90" rx="14"/>
  <text class="title" x="345" y="73" text-anchor="middle">Module 03</text>
  <text class="sub" x="345" y="100" text-anchor="middle">C# · async · ownership · host</text>

  <rect class="soft" x="570" y="35" width="270" height="90" rx="14"/>
  <text class="title" x="705" y="73" text-anchor="middle">Module 02</text>
  <text class="sub" x="705" y="100" text-anchor="middle">HTTP · TCP · process · resources</text>

  <path class="edge" d="M345 125 V170 H355 V200" marker-end="url(#arrow)"/>
  <path class="edge" d="M705 125 V170 H355"/>

  <rect class="soft" x="225" y="200" width="260" height="90" rx="14"/>
  <text class="title" x="355" y="255" text-anchor="middle">Request lifecycle</text>

  <path class="edge" d="M355 290 V335 H135 V365" marker-end="url(#arrow)"/>
  <path class="edge" d="M355 290 V335 H390 V365" marker-end="url(#arrow)"/>
  <path class="edge" d="M355 290 V335 H645 V365" marker-end="url(#arrow)"/>
  <path class="edge" d="M355 290 V335 H900 V365" marker-end="url(#arrow)"/>

  <rect class="box" x="25" y="365" width="220" height="115" rx="14"/>
  <text class="title" x="135" y="405" text-anchor="middle">Endpoint contract</text>
  <text class="sub" x="135" y="435" text-anchor="middle">binding · validation</text>
  <text class="sub" x="135" y="458" text-anchor="middle">errors · status codes</text>

  <rect class="box" x="280" y="365" width="220" height="115" rx="14"/>
  <text class="title" x="390" y="405" text-anchor="middle">Authn / Authz</text>
  <text class="sub" x="390" y="435" text-anchor="middle">policy · tenant</text>
  <text class="sub" x="390" y="458" text-anchor="middle">resource · audit</text>

  <rect class="box" x="535" y="365" width="220" height="115" rx="14"/>
  <text class="title" x="645" y="405" text-anchor="middle">Capacity boundary</text>
  <text class="sub" x="645" y="435" text-anchor="middle">pagination · idempotency</text>
  <text class="sub" x="645" y="458" text-anchor="middle">rate limit · cache</text>

  <rect class="box" x="790" y="365" width="220" height="115" rx="14"/>
  <text class="title" x="900" y="405" text-anchor="middle">Integration boundary</text>
  <text class="sub" x="900" y="435" text-anchor="middle">workers · files · HTTP</text>
  <text class="sub" x="900" y="458" text-anchor="middle">webhooks · replay</text>

  <path class="edge" d="M135 480 V530 H260 V560" marker-end="url(#arrow)"/>
  <path class="edge" d="M390 480 V530 H515 V560" marker-end="url(#arrow)"/>
  <path class="edge" d="M645 480 V530 H770 V560" marker-end="url(#arrow)"/>
  <path class="edge" d="M900 480 V530 H770"/>

  <rect class="box" x="150" y="560" width="220" height="95" rx="14"/>
  <text class="title" x="260" y="600" text-anchor="middle">Module 05</text>
  <text class="sub" x="260" y="630" text-anchor="middle">SQL + relational execution</text>

  <rect class="box" x="405" y="560" width="220" height="95" rx="14"/>
  <text class="title" x="515" y="600" text-anchor="middle">Module 06</text>
  <text class="sub" x="515" y="630" text-anchor="middle">API design + evolution</text>

  <rect class="accent" x="660" y="560" width="220" height="95" rx="14"/>
  <text class="title" x="770" y="600" text-anchor="middle">Project 02</text>
  <text class="sub" x="770" y="630" text-anchor="middle">Order Management</text>

  <path class="edge" d="M515 655 V700 H650" marker-end="url(#arrow)"/>
  <rect class="soft" x="650" y="680" width="250" height="65" rx="14"/>
  <text class="title" x="775" y="720" text-anchor="middle">Module 07 · ASP.NET Core</text>
</svg>
