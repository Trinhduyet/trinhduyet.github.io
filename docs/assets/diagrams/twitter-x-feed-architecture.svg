<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">Twitter/X hybrid feed architecture</title>
<desc id="desc">Three lanes show the tweet write path, event-driven fan-out, and the Following or For You read path with eligibility filtering.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#273144}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px;fill:#53647a}.title{font-size:22px;font-weight:800}.lane{font-size:12px;font-weight:800;fill:#9a4b21;letter-spacing:1px}.node-title{font-size:15px;font-weight:750}.detail{font-size:12px;fill:#57677c}.note{font-size:12px;font-style:italic;fill:#63738b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55718f"/></marker></defs>
<rect width="1120" height="520" fill="#f6f8fb"/>
<text class="eyebrow" x="38" y="36">SYSTEM DESIGN · FEED</text><text class="title" x="38" y="66">Twitter/X: hybrid fan-out architecture</text>
<rect x="25" y="90" width="1070" height="122" rx="12" fill="#e9f2fd"/>
<rect x="25" y="228" width="1070" height="122" rx="12" fill="#fff0e4"/>
<rect x="25" y="366" width="1070" height="122" rx="12" fill="#e9f5f0"/>
<text class="lane" x="42" y="109">WRITE · STRONG LOCAL COMMIT</text><text class="lane" x="42" y="247">ASYNC · BOUNDED FAN-OUT</text><text class="lane" x="42" y="385">READ · PRIVACY-AWARE HYDRATION</text>
<g fill="#fff" stroke="#7994b1" stroke-width="1.3"><rect x="45" y="128" width="192" height="66" rx="9"/><rect x="309" y="128" width="210" height="66" rx="9"/><rect x="591" y="128" width="212" height="66" rx="9"/><rect x="875" y="128" width="197" height="66" rx="9"/><rect x="45" y="266" width="192" height="66" rx="9"/><rect x="309" y="266" width="210" height="66" rx="9"/><rect x="591" y="266" width="212" height="66" rx="9"/><rect x="875" y="266" width="197" height="66" rx="9"/><rect x="45" y="404" width="192" height="66" rx="9"/><rect x="309" y="404" width="210" height="66" rx="9"/><rect x="591" y="404" width="212" height="66" rx="9"/><rect x="875" y="404" width="197" height="66" rx="9"/></g>
<g text-anchor="middle"><text class="node-title" x="141" y="153">Mobile / Web</text><text class="detail" x="141" y="175">Create tweet</text><text class="node-title" x="414" y="153">Gateway + Auth</text><text class="detail" x="414" y="175">Rate limit · identity</text><text class="node-title" x="697" y="153">Tweet Service</text><text class="detail" x="697" y="175">Idempotent create</text><text class="node-title" x="973" y="153">Tweet DB</text><text class="detail" x="973" y="175">Tweet + outbox commit</text><text class="node-title" x="141" y="291">Outbox Relay</text><text class="detail" x="141" y="313">CDC or poller</text><text class="node-title" x="414" y="291">Event Broker</text><text class="detail" x="414" y="313">Replay · partition</text><text class="node-title" x="697" y="291">Fan-out Workers</text><text class="detail" x="697" y="313">Batch · dedup · backpressure</text><text class="node-title" x="973" y="291">Timeline Store</text><text class="detail" x="973" y="313">Viewer ID + Tweet ID</text><text class="node-title" x="141" y="429">Following / FYP</text><text class="detail" x="141" y="451">Cursor requests</text><text class="node-title" x="414" y="429">Feed Query</text><text class="detail" x="414" y="451">Timeline + author merge</text><text class="node-title" x="697" y="429">Hydrate + Eligibility</text><text class="detail" x="697" y="451">Private · block · deleted</text><text class="node-title" x="973" y="429">Rank + Response</text><text class="detail" x="973" y="451">Stable cursor · freshness</text></g>
<g fill="none" stroke="#55718f" stroke-width="2" marker-end="url(#arrow)"><path d="M237 161H303"/><path d="M519 161H585"/><path d="M803 161H869"/><path d="M237 299H303"/><path d="M519 299H585"/><path d="M803 299H869"/><path d="M237 437H303"/><path d="M519 437H585"/><path d="M803 437H869"/></g>
<text class="note" x="38" y="507">Celebrities can be merged on read; a cached timeline never overrides access-control decisions.</text>
</svg>
