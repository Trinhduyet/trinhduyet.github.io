<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
<title id="title">System Design process</title>
<desc id="desc">Editorial flow from business problem through requirements, capacity, data, failure model, options, trade-offs and evidence.</desc>
<style>
text{font-family:Inter,system-ui,sans-serif;fill:#2d3142}.tag{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#7a8399}.title{font-size:15px;font-weight:700}.sub{font-size:11px;fill:#4f5d75}.callout{font-family:Georgia,serif;font-style:italic;font-size:15px;fill:#4f5d75}
</style>
<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#4f5d75"/></marker><marker id="accent" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#eb6c36"/></marker></defs>
<rect width="1080" height="360" fill="#f5f5f5"/>
<text x="42" y="38" class="tag">SYSTEM DESIGN</text>
<text x="42" y="64" class="title">Requirements create the architecture — components do not.</text>
<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arr)">
<path d="M166 156H210"/><path d="M334 156H378"/><path d="M502 156H546"/><path d="M670 156H714"/><path d="M838 156H882"/>
</g>
<path d="M944 194V258H130V194" fill="none" stroke="#eb6c36" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#accent)"/>
<g>
<rect x="42" y="118" width="124" height="76" rx="8" fill="#e8edf2" stroke="#7a8399"/><text x="104" y="148" text-anchor="middle" class="title">Problem</text><text x="104" y="169" text-anchor="middle" class="sub">critical flow</text>
<rect x="210" y="118" width="124" height="76" rx="8" fill="#fff" stroke="#2d3142"/><text x="272" y="145" text-anchor="middle" class="title">Requirements</text><text x="272" y="166" text-anchor="middle" class="sub">FR · NFR · SLO</text>
<rect x="378" y="118" width="124" height="76" rx="8" fill="#fff" stroke="#2d3142"/><text x="440" y="145" text-anchor="middle" class="title">Capacity</text><text x="440" y="166" text-anchor="middle" class="sub">RPS · data · cost</text>
<rect x="546" y="118" width="124" height="76" rx="8" fill="#fff" stroke="#2d3142"/><text x="608" y="145" text-anchor="middle" class="title">Data</text><text x="608" y="166" text-anchor="middle" class="sub">truth · consistency</text>
<rect x="714" y="118" width="124" height="76" rx="8" fill="#fff0e9" stroke="#eb6c36" stroke-width="1.5"/><text x="776" y="145" text-anchor="middle" class="title">Failure Model</text><text x="776" y="166" text-anchor="middle" class="sub">timeout · overload</text>
<rect x="882" y="118" width="156" height="76" rx="8" fill="#fff" stroke="#2d3142"/><text x="960" y="145" text-anchor="middle" class="title">Decision</text><text x="960" y="166" text-anchor="middle" class="sub">trade-off · evidence</text>
</g>
<text x="540" y="302" text-anchor="middle" class="callout">Load tests, failure drills and cost estimates feed the next design iteration.</text>
