<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Module 03 dependency map</title>
  <desc id="desc">Dependency map từ Module 01 và 02 tới các learning slices của .NET Runtime, Module 04 và Project 01.</desc>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#2d3142}
    .title{font-size:20px;font-weight:700}
    .sub{font-size:14px;fill:#4f5d75}
    .box{fill:#fff;stroke:#2d3142;stroke-width:1.4}
    .soft{fill:#e8edf2;stroke:#7a8399;stroke-width:1.4}
    .accent{fill:#fff0e9;stroke:#eb6c36;stroke-width:1.6}
    .edge{fill:none;stroke:#64748b;stroke-width:1.5}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1120" height="650" fill="#f8fafc"/>

  <!-- top prerequisites -->
  <rect class="box" x="210" y="38" width="260" height="92" rx="14"/>
  <text class="title" x="340" y="78" text-anchor="middle">Module 01</text>
  <text class="sub" x="340" y="104" text-anchor="middle">types · memory · concurrency</text>

  <rect class="soft" x="650" y="38" width="260" height="92" rx="14"/>
  <text class="title" x="780" y="78" text-anchor="middle">Module 02</text>
  <text class="sub" x="780" y="104" text-anchor="middle">process · signals · resources</text>

  <!-- edges to runtime concepts -->
  <path class="edge" d="M340 130 V170 H150 V205" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 130 V170 H410 V205" marker-end="url(#arrow)"/>
  <path class="edge" d="M780 130 V170 H710 V205" marker-end="url(#arrow)"/>
  <path class="edge" d="M780 130 V170 H970 V205" marker-end="url(#arrow)"/>

  <!-- middle row -->
  <rect class="box" x="40" y="205" width="220" height="110" rx="14"/>
  <text class="title" x="150" y="252" text-anchor="middle">Types + generics</text>
  <text class="sub" x="150" y="280" text-anchor="middle">compile-time contracts</text>

  <rect class="box" x="300" y="205" width="220" height="110" rx="14"/>
  <text class="title" x="410" y="242" text-anchor="middle">
    <tspan x="410" dy="0">Host + DI + config</tspan>
    <tspan x="410" dy="26">+ logging</tspan>
  </text>

  <rect class="accent" x="600" y="205" width="220" height="110" rx="14"/>
  <text class="title" x="710" y="242" text-anchor="middle">
    <tspan x="710" dy="0">ThreadPool</tspan>
    <tspan x="710" dy="26">+ diagnostics</tspan>
  </text>

  <rect class="box" x="860" y="205" width="220" height="110" rx="14"/>
  <text class="title" x="970" y="252" text-anchor="middle">GC + allocations</text>
  <text class="sub" x="970" y="280" text-anchor="middle">runtime memory</text>

  <!-- lower concepts -->
  <path class="edge" d="M150 315 V360 H300 V390" marker-end="url(#arrow)"/>
  <path class="edge" d="M410 315 V345 H470 V390" marker-end="url(#arrow)"/>
  <path class="edge" d="M710 315 V345 H650 V390" marker-end="url(#arrow)"/>
  <path class="edge" d="M970 315 V360 H820 V390" marker-end="url(#arrow)"/>

  <rect class="box" x="190" y="390" width="220" height="105" rx="14"/>
  <text class="title" x="300" y="433" text-anchor="middle">Ownership + failure</text>
  <text class="sub" x="300" y="461" text-anchor="middle">cleanup · exception boundary</text>

  <rect class="soft" x="450" y="390" width="220" height="105" rx="14"/>
  <text class="title" x="560" y="430" text-anchor="middle">Module 04</text>
  <text class="sub" x="560" y="458" text-anchor="middle">Backend request lifecycle</text>

  <rect class="box" x="710" y="390" width="220" height="105" rx="14"/>
  <text class="title" x="820" y="430" text-anchor="middle">Project 01</text>
  <text class="sub" x="820" y="458" text-anchor="middle">Async File Processor</text>

  <path class="edge" d="M300 495 V540 H560 V565" marker-end="url(#arrow)"/>
  <path class="edge" d="M560 495 V565" marker-end="url(#arrow)"/>
  <path class="edge" d="M820 495 V540 H560"/>

  <rect class="box" x="430" y="565" width="260" height="70" rx="14"/>
  <text class="title" x="560" y="607" text-anchor="middle">Async + cancellation</text>
</svg>
