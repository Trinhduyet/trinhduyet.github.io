name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'Dev.sln'
      - 'labs/**'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'Dev.sln'
      - 'labs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Pages documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Audit portable documentation paths
        run: python scripts/audit-docs.py

      - name: Normalize legacy SVG text bounds
        run: python scripts/normalize-diagrams.py

      - name: Audit diagram sources
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RInE --include='*.md' '^[[:space:]]*(```|~~~)mermaid([[:space:]]|$)' docs || true)"
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "::error::Mermaid sources remain. Use committed editorial SVG assets or wiretext for simple mental models."
            exit 1
          fi

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation strictly
        run: mkdocs build --strict --site-dir site

      - name: Verify critical Pages output
        shell: bash
        run: |
          set -euo pipefail
          critical=(
            site/index.html
            site/00-roadmap/master-roadmap/index.html
            site/03-dotnet/index.html
            site/04-backend/index.html
            site/14-cloud/index.html
            site/17-distributed-systems/index.html
            site/19-ai-engineering/index.html
            site/24-system-design/index.html
            site/25-software-architecture/index.html
          )
          for file in "${critical[@]}"; do
            test -s "$file" || { echo "::error::Missing critical page: $file"; exit 1; }
          done
          echo "Critical Pages output verified."

      - name: Publish repository lab/source links into Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/labs
          cp -R labs/. site/labs/
          cp README.md site/README.md
          cp Dev.sln site/Dev.sln

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  validate-labs:
    name: Validate .NET labs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore labs
        run: dotnet restore Dev.sln

      - name: Build labs
        run: dotnet build Dev.sln --configuration Release --no-restore

      - name: Test labs
        run: dotnet test Dev.sln --configuration Release --no-build --no-restore

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
