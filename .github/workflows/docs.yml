name: Deploy MkDocs Material to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Pages publishing mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("build_type", ""))')"
          echo "GitHub Pages build_type=${build_type}"
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::Settings → Pages → Build and deployment → Source must be GitHub Actions. Current build_type=${build_type}."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Audit portable documentation paths
        run: python scripts/audit-docs.py

      - name: Audit learning quality and runnable evidence
        run: python scripts/audit-learning-quality.py

      - name: Normalize legacy SVG text bounds
        run: python scripts/normalize-diagrams.py

      - name: Audit diagram sources
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RInE --include='*.md' '^[[:space:]]*(```|~~~)mermaid([[:space:]]|$)' docs || true)"
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "::error::Mermaid sources remain. Use committed editorial SVG assets or wiretext for simple mental models."
            exit 1
          fi

      - name: Build MkDocs Material
        run: mkdocs build --strict --site-dir site

      - name: Verify generated site is Material, not raw Markdown
        shell: bash
        run: |
          set -euo pipefail
          critical=(
            site/index.html
            site/00-roadmap/master-roadmap/index.html
            site/03-dotnet/index.html
            site/04-backend/index.html
            site/14-cloud/index.html
            site/17-distributed-systems/index.html
            site/19-ai-engineering/index.html
            site/24-system-design/index.html
            site/25-software-architecture/index.html
          )
          for file in "${critical[@]}"; do
            test -s "$file" || { echo "::error::Missing critical page: $file"; exit 1; }
          done

          grep -q 'class="md-header' site/index.html || {
            echo '::error::Homepage does not look like MkDocs Material output.'
            exit 1
          }

          if grep -Fq '{ .hero-button' site/index.html || grep -Fq '{ .course-card' site/index.html; then
            echo '::error::Raw Markdown attribute syntax leaked into generated homepage.'
            exit 1
          fi

          echo 'MkDocs Material output verified.'

      - name: Publish repository lab/source links into Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/labs
          cp -R labs/. site/labs/
          cp README.md site/README.md
          cp Dev.sln site/Dev.sln

      - name: Write deployment metadata
        shell: bash
        run: |
          cat > site/deploy-meta.json <<EOF
          {
            "repository": "Trinhduyet/trinhduyet.github.io",
            "commit": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "generator": "MkDocs Material"
          }
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site serves this workflow artifact
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          marker_url="${base}/deploy-meta.json"
          echo "Waiting for ${marker_url} to expose commit ${GITHUB_SHA}"

          for attempt in $(seq 1 12); do
            body="$(curl -fsSL -H 'Cache-Control: no-cache' "${marker_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq "\"commit\": \"${GITHUB_SHA}\""; then
              echo "Live MkDocs artifact verified on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: live marker is not this commit yet."
            sleep 10
          done

          echo "::error::GitHub Pages did not serve the MkDocs artifact for commit ${GITHUB_SHA}."
          exit 1
