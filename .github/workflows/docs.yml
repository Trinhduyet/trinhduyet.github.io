name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'Dev.sln'
      - 'labs/**'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'Dev.sln'
      - 'labs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs and labs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Upload docs migration snapshot
        uses: actions/upload-artifact@v4
        with:
          name: diagram-migration-source
          path: |
            docs
            mkdocs.yml
          retention-days: 1

      - name: Audit diagram sources
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RIn --include='*.md' '```mermaid' docs || true)"
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "::error::Mermaid sources remain. Convert them to Diagram Design standalone HTML/SVG assets."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation strictly
        run: mkdocs build --strict --site-dir site

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore labs
        run: dotnet restore Dev.sln

      - name: Build labs
        run: dotnet build Dev.sln --configuration Release --no-restore

      - name: Test labs
        run: dotnet test Dev.sln --configuration Release --no-build --no-restore

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
