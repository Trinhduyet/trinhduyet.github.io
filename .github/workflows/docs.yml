name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'Dev.sln'
      - 'labs/**'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'Dev.sln'
      - 'labs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Pages documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Pages publishing mode
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("build_type", ""))')"
          echo "GitHub Pages build_type=${build_type}"
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::GitHub Pages is still using legacy branch publishing. Settings → Pages → Build and deployment → Source must be GitHub Actions. Legacy pages-build-deployment serves docs/ directly and bypasses the MkDocs artifact."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Audit portable documentation paths
        run: python scripts/audit-docs.py

      - name: Normalize legacy SVG text bounds
        run: python scripts/normalize-diagrams.py

      - name: Audit diagram sources
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RInE --include='*.md' '^[[:space:]]*(```|~~~)mermaid([[:space:]]|$)' docs || true)"
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "::error::Mermaid sources remain. Use committed editorial SVG assets or wiretext for simple mental models."
            exit 1
          fi

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation strictly
        run: mkdocs build --strict --site-dir site

      - name: Verify critical Pages output
        shell: bash
        run: |
          set -euo pipefail
          critical=(
            site/index.html
            site/00-roadmap/master-roadmap/index.html
            site/03-dotnet/index.html
            site/04-backend/index.html
            site/14-cloud/index.html
            site/17-distributed-systems/index.html
            site/19-ai-engineering/index.html
            site/24-system-design/index.html
            site/25-software-architecture/index.html
          )
          for file in "${critical[@]}"; do
            test -s "$file" || { echo "::error::Missing critical page: $file"; exit 1; }
          done
          echo "Critical Pages output verified."

      - name: Publish repository lab/source links into Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/labs
          cp -R labs/. site/labs/
          cp README.md site/README.md
          cp Dev.sln site/Dev.sln

      - name: Write deployment metadata
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cat > site/deploy-meta.json <<EOF
          {
            "repository": "Trinhduyet/trinhduyet.github.io",
            "commit": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "generator": "MkDocs Material"
          }
          EOF

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  validate-labs:
    name: Validate .NET labs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore labs
        run: dotnet restore Dev.sln

      - name: Build labs
        run: dotnet build Dev.sln --configuration Release --no-restore

      - name: Test labs
        run: dotnet test Dev.sln --configuration Release --no-build --no-restore

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site serves this workflow artifact
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          marker_url="${base}/deploy-meta.json"
          echo "Waiting for ${marker_url} to expose commit ${GITHUB_SHA}"

          for attempt in $(seq 1 12); do
            body="$(curl -fsSL -H 'Cache-Control: no-cache' "${marker_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq "\"commit\": \"${GITHUB_SHA}\""; then
              echo "Live Pages artifact verified on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: live marker is not this commit yet."
            sleep 10
          done

          echo "::error::GitHub Pages did not serve deploy-meta.json for commit ${GITHUB_SHA}. Check Settings → Pages → Source = GitHub Actions and ensure no legacy pages-build-deployment is active."
          exit 1
