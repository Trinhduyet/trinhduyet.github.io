name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'Dev.sln'
      - 'labs/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs and labs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Apply one-time tilde Mermaid migration
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/api-design-complete'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/Trinhduyet/trinhduyet.github.io/fff5c548606703109884d7590c59bc7e8b9a6cb9/scripts/migrate_diagram_design.py \
            -o /tmp/migrate_diagram_design.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/migrate_diagram_design.py')
          s = p.read_text()
          old = "blocks=list(re.finditer(r'```mermaid\\n(.*?)\\n```',text,re.S))"
          new = "blocks=list(re.finditer(r'(?:```|~~~)mermaid\\n(.*?)\\n(?:```|~~~)',text,re.S))"
          if old not in s:
              raise SystemExit('Expected migration regex not found')
          p.write_text(s.replace(old, new))
          PY
          python /tmp/migrate_diagram_design.py

      - name: Commit migrated Diagram Design assets
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/api-design-complete'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs mkdocs.yml; then
            echo "No migration changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- docs mkdocs.yml
            git commit -m "docs: migrate legacy tilde Mermaid diagrams to SVG"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Audit diagram sources
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RInE --include='*.md' '^[[:space:]]*(```|~~~)mermaid([[:space:]]|$)' docs || true)"
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "::error::Mermaid sources remain. Use Diagram Design editorial SVG assets or wiretext."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation strictly
        run: mkdocs build --strict --site-dir site

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore labs
        run: dotnet restore Dev.sln

      - name: Build labs
        run: dotnet build Dev.sln --configuration Release --no-restore

      - name: Test labs
        run: dotnet test Dev.sln --configuration Release --no-build --no-restore

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
